name: Documentation Policy

on:
  push:
    branches: [feature, stage, main]
    paths:
      - "specification/**"
      - "docs/**"
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Documentation edits should not wait behind the full application/browser suite.
concurrency:
  group: docs-policy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Check documentation and test independence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit technical specs and tests for production editorial coupling
        run: npm run audit:content-independence
