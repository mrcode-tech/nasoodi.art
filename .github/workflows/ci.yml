name: Nasoodi.art CI
on:
  push:
    branches: [feature, stage, main]
  pull_request:
    branches: [feature, stage, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Install, lint, typecheck, test, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run content publication tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Smoke test production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/nasoodi-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --location --fail --silent --show-error http://127.0.0.1:3000/ --output /tmp/nasoodi-homepage.html 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/nasoodi-next.log; echo "Server did not become ready." >&2; exit 1; fi
          if ! grep -qi '<html' /tmp/nasoodi-homepage.html; then cat /tmp/nasoodi-next.log; echo "Homepage response was not HTML." >&2; exit 1; fi
          for locale in fa en; do
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000/$locale" | grep -qi '<html'; then echo "Localized route failed: $locale" >&2; exit 1; fi
          done
          echo "Root redirect and both locale routes returned HTML."
