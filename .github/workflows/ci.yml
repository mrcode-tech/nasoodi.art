name: Nasoodi.art CI
# Run once for every pushed commit on feature, stage, and main. Push-triggered
# checks are attached to the commit and remain visible from any pull request
# that contains it. Browser coverage includes responsive navigation and its
# portaled language menu. Avoid duplicate pull_request runs for the same commit.
on:
  push:
    branches: [feature, stage, main]
  workflow_dispatch:
permissions:
  contents: read
# Keep release-branch runs serialized. Key feature runs by commit so a
# cancelled stale run cannot block verification of a newer feature commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.ref_name }}-${{ github.ref_name == 'feature' && github.sha || 'branch' }}
  cancel-in-progress: true
jobs:
  validate:
    name: Install, lint, typecheck, unit test, build, browser test, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rendering requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2
          python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render and validate Journal sticker SVG
        run: python scripts/render-journal-sticker.py
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run content publication tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Inventory candidate portfolio assets
        run: |
          mkdir -p asset-audit
          npm run audit:assets -- --output=asset-audit/manifest.json
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and responsive tests
        run: npm run test:e2e
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasoodi-visual-qa-${{ github.sha }}
          path: |
            test-results/
            asset-audit/manifest.json
            artifacts/journal-announcement-sticker.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Journal sticker review PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-announcement-sticker-review-${{ github.sha }}
          path: artifacts/journal-announcement-sticker.png
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/nasoodi-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --location --fail --silent --show-error http://127.0.0.1:3000/ --output /tmp/nasoodi-homepage.html 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/nasoodi-next.log; echo "Server did not become ready." >&2; exit 1; fi
          for locale in fa en; do
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000/$locale" | grep -qi '<html'; then echo "Localized route failed: $locale" >&2; exit 1; fi
          done
          echo "Root redirect and both locale routes returned HTML."
